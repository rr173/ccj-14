<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>矩形几何约束编辑器</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">▭ 矩形约束编辑器</div>
    <div class="toolbar">
      <button id="btn-add-rect" title="添加矩形 (A)">＋ 矩形</button>
      <span class="sep"></span>
      <button id="btn-undo" title="撤销 (Ctrl+Z)">↶ 撤销</button>
      <button id="btn-redo" title="重做 (Ctrl+Y / Ctrl+Shift+Z)">↷ 重做</button>
      <span class="sep"></span>
      <button id="btn-snap" class="primary">🔗 添加约束…</button>
      <button id="btn-delete" class="danger" disabled>删除所选</button>
      <span class="spacer"></span>
      <span id="branch-chip" class="chip" title="当前编辑分支（审计事件按分支追加）">⎘ 主分支</span>
      <span id="version-chip" class="chip muted" title="当前编辑内容基于的版本">未保存版本</span>
      <span id="hash-chip" class="chip" title="当前解的确定性指纹（位置+约束成败+冲突）">hash —</span>
      <span id="save-chip" class="chip muted">未保存</span>
    </div>
  </header>

  <!-- 分支已前进横幅：同一分支在另一页面已提交，本页修改基于过期事件序号，拒绝覆盖 -->
  <div id="conflict-banner" class="hidden">
    <span id="conflict-text">⚠ <b>版本冲突</b>：另一个页面已保存了更新的内容。为避免覆盖对方数据，当前页面的修改<b>未保存</b>——请重新加载后再继续编辑。</span>
    <button id="btn-reload">重新加载</button>
  </div>

  <!-- 回放横幅：正在浏览历史事件，布局只读，可退出或另存为分支 -->
  <div id="replay-banner" class="hidden">
    <span id="replay-text">▶ 正在回放历史事件（只读）</span>
    <span class="spacer"></span>
    <button id="btn-replay-fork">⎇ 另存为新分支并编辑</button>
    <button id="btn-replay-exit" class="primary">回到当前 head</button>
  </div>

  <main class="main">
    <!-- 画布 -->
    <section class="canvas-wrap" id="canvas-wrap">
      <svg id="canvas" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="#e6e9ef" stroke-width="1"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
            <path d="M0,0 L7,3 L0,6 Z" fill="#8a93a6"/>
          </marker>
        </defs>
        <rect id="canvas-bg" x="0" y="0" width="1000" height="700" fill="url(#grid)" stroke="#c2c9d6"/>
        <g id="edge-layer"></g>
        <g id="rect-layer"></g>
        <g id="overlay-layer"></g>
      </svg>
      <div id="hint" class="hint">拖动矩形移动；Shift+点击加入多选 / 框选成组；双击重命名；选中矩形后用顶部「添加约束」。</div>
    </section>

    <!-- 右侧面板 -->
    <aside class="side">
      <div class="tabs">
        <button class="tab active" data-tab="constraints">约束</button>
        <button class="tab" data-tab="props">属性</button>
        <button class="tab" data-tab="conflicts">冲突 <span id="conflict-count" class="badge">0</span></button>
        <button class="tab" data-tab="versions">版本 <span id="version-count" class="badge zero">0</span></button>
        <button class="tab" data-tab="audit">审计/分支 <span id="audit-count" class="badge zero">0</span></button>
      </div>

      <div class="tab-body" data-body="constraints">
        <div id="constraint-list" class="list"></div>
      </div>

      <div class="tab-body hidden" data-body="props">
        <div id="props-panel" class="props"></div>
      </div>

      <div class="tab-body hidden" data-body="conflicts">
        <div id="conflict-panel" class="conflicts"></div>
      </div>

      <div class="tab-body hidden" data-body="versions">
        <div class="ver-save">
          <input id="ver-name" type="text" placeholder="版本名称（如：首页初版）" maxlength="40" />
          <button id="btn-save-version" class="primary">保存为版本</button>
        </div>
        <div id="version-list" class="list"></div>
        <h4 class="ver-h">版本比较</h4>
        <div class="ver-cmp">
          <select id="cmp-a" title="基准版本"></select>
          <span class="cmp-arrow">→</span>
          <select id="cmp-b" title="对比版本"></select>
        </div>
        <div id="compare-result"></div>
      </div>

      <div class="tab-body hidden" data-body="audit">
        <div class="audit-bar">
          <label class="audit-field">分支
            <select id="audit-branch"></select>
          </label>
          <button id="btn-new-branch" class="mini" title="从当前分支 head 另存为新分支">⎇ 从当前另存分支</button>
        </div>
        <div class="audit-bar">
          <label class="audit-field grow">操作者署名
            <input id="audit-actor" type="text" placeholder="你的名字（记入每条审计事件）" maxlength="40" />
          </label>
        </div>
        <div id="audit-warnings" class="audit-warnings hidden"></div>
        <div id="audit-timeline" class="list timeline"></div>
        <h4 class="ver-h">分支比较（当前 head 差异）</h4>
        <div class="ver-cmp">
          <select id="bcmp-a" title="基准分支"></select>
          <span class="cmp-arrow">→</span>
          <select id="bcmp-b" title="对比分支"></select>
        </div>
        <div id="branch-compare-result"></div>
      </div>
    </aside>
  </main>
</div>

<!-- 添加约束对话框 -->
<div id="dlg" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <span id="dlg-title">添加约束</span>
      <button id="dlg-close" class="icon-btn">✕</button>
    </div>
    <div id="dlg-body"></div>
    <div class="modal-foot">
      <span id="dlg-error" class="dlg-error"></span>
      <span class="spacer"></span>
      <button id="dlg-cancel">取消</button>
      <button id="dlg-ok" class="primary">提交约束</button>
    </div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
